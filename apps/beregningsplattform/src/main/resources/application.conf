application {
    appName = "beregningsplattformen-beregningsplattform"
    appName = ${?NAIS_APP_NAME}
    namespace = "beregningsplattform"
    namespace = ${?NAIS_NAMESPACE}
}

azureAd {
    clientId = ${?AZURE_APP_CLIENT_ID}
    wellKnownUrl = ${?AZURE_APP_WELL_KNOWN_URL}
}

postgres {
    jdbcUrl = ${?DB_JDBC_URL}
    name = "beregningsplattformen-beregningsplattform"
    name = ${?DB_DATABASE}
    host = "localhost"
    host = ${?DB_HOST}
    port = "5432"
    port = ${?DB_PORT}
    username = ${?DB_USERNAME}
    password = ${?DB_PASSWORD}
}
