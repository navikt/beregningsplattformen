apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: beregningsplattformen-beregningsplattform
  namespace: beregningsplattform
  annotations:
    github.com/repository: "navikt/beregningsplattformen"
    github.com/repository-url: "https://github.com/navikt/beregningsplattformen"
  labels:
    team: beregningsplattform
    app.kubernetes.io/part-of: beregningsplattformen
    app.kubernetes.io/component: beregningsplattform
spec:
  image: "{{{ image }}}"
  port: 8080
  replicas:
    min: 1
    max: 2
    cpuThresholdPercentage: 75
  liveness:
    path: /internal/isAlive
    initialDelay: 5
    timeout: 5
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /internal/isReady
    initialDelay: 5
    periodSeconds: 5
    timeout: 5
  resources:
    limits:
      memory: 4096Mi
    requests:
      cpu: 100m
      memory: 256Mi
  prometheus:
    enabled: true
    path: /internal/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: azure-token-generator
          namespace: nais
    outbound:
      rules:
        - application: logging
          namespace: nais-system
      external:
        - host: mqls02.preprod.local
          ports:
            - port: 1413
  gcp:
    sqlInstances:
      - type: POSTGRES_18
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-f1-micro
        databases:
          - name: beregningsplattformen-beregningsplattform
            envVarPrefix: DB
        flags:
          - name: "cloudsql.enable_pgaudit"
            value: "off"
          - name: "pgaudit.log"
            value: "write,ddl,role"
          - name: "pgaudit.log_parameter"
            value: "off"
          - name: "cloudsql.logical_decoding"
            value: "on"
          - name: "pgaudit.log_relation"
            value: "on"
  envFrom:
    - secret: beregningsplattformen-mottak-secrets
