application {
    appName = "beregningsplattformen-mottak"
    appName = ${?NAIS_APP_NAME}
    namespace = "beregningsplattform"
    namespace = ${?NAIS_NAMESPACE}
}

azureAd {
    clientId = ${?AZURE_APP_CLIENT_ID}
    wellKnownUrl = ${?AZURE_APP_WELL_KNOWN_URL}
}

mq {
    hostname = ${?MQ_HOSTNAME}
    port = ${?MQ_PORT}
    manager = ${?MQ_MANAGER}
    channel = ${?MQ_CHANNEL}
    queue = ${?MQ_BEREGNINGSPLATTFORM_MOTTAK_QUEUE}
    username = ${?MQ_USERNAME}
    password = ${?MQ_PASSWORD}
}
