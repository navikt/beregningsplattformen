application {
    appName = "beregningsplattformen-trekk"
    appName = ${?NAIS_APP_NAME}
    namespace = "beregningsplattform"
    namespace = ${?NAIS_NAMESPACE}
}

azureAd {
    clientId = ${?AZURE_APP_CLIENT_ID}
    wellKnownUrl = ${?AZURE_APP_WELL_KNOWN_URL}
}

mq {
    hostname = ${?MQ_HOSTNAME}
    port = ${?MQ_PORT}
    manager = ${?MQ_MANAGER}
    channel = ${?MQ_CHANNEL}
    trekkQueue = ${?MQ_BEREGNINGSPLATTFORM_TREKK_QUEUE}
    trekkfeilQueue = ${?MQ_BEREGNINGSPLATTFORM_TREKKFEIL_QUEUE}
    username = ${?MQ_USERNAME}
    password = ${?MQ_PASSWORD}
}

postgres {
    hostname = ${?POSTGRES_HOSTNAME}
    port = ${?POSTGRES_PORT}
    database = ${?POSTGRES_DATABASE}
    username = ${?POSTGRES_USERNAME}
    password = ${?POSTGRES_PASSWORD}
    jdbcUrl = "jdbc:postgresql://$hostname:$port/$database"
}
