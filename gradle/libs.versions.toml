[versions]
# Kotlin
kotlin = "2.4.21"

# Ktor
ktorVersion = "3.6.0"

# Micrometer
micrometerVersion = "1.17.1"

# Trekktabeller
trekkrutine2025 = "1.0_20250507160209_6be0e94"
trekkrutine2026 = "1.0_20260113090201_5cbf08a"

# Serialization
jackson = "2.22.4"
kotlinx-serialization = "1.12.0"

# Logging
kotlin-logging = "3.0.5"
logback = "1.6.5"

# Test
kotest = "6.2.6"

# Plugins
kover-plugin = "0.9.11"
ktlint-plugin = "0.1.0-dev.1252+ec71da4"

[libraries]
# Ktor
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktorVersion" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt-jvm", version.ref = "ktorVersion" }
ktor-server-metrics-micrometer = { module = "io.ktor:ktor-server-metrics-micrometer-jvm", version.ref = "ktorVersion" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktorVersion" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktorVersion" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktorVersion" }
ktor-server-request-validation = { module = "io.ktor:ktor-server-request-validation-jvm", version.ref = "ktorVersion" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktorVersion" }

# Micrometer
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometerVersion" }

# Trekktabeller
trekkrutine2025 = { module = "no.nav.sokos.trekkrutine:trekkrutine-2025", version.ref = "trekkrutine2025" }
trekkrutine2026 = { module = "no.nav.sokos.trekkrutine:trekkrutine-2026", version.ref = "trekkrutine2026" }

# Serialization
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm", version.ref = "kotlinx-serialization" }

# Logging
kotlin-logging = { module = "io.github.microutils:kotlin-logging-jvm", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# Jackson (XML-deserialisering)
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

# Test
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotest" }

[bundles]
jackson = [
    "jackson-module-kotlin",
    "jackson-dataformat-xml",
    "jackson-datatype-jsr310",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover-plugin" }
ktlint = { id = "no.nav.ktlintgradle.ktlint", version.ref = "ktlint-plugin" }
