name: Deploy lab backend to dev-gcp

on:
  push:
    branches: [main]
    paths:
      - "apps/lab/backend/**"
      - "libs/**" # Lab bruker alle dagens biblioteker, inkludert tid via oppdrag. Snevr inn filteret hvis nye biblioteker ikke brukes av lab.
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/deploy-lab-backend-dev.yaml"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: deploy-lab-backend-dev
  cancel-in-progress: false

jobs:
  build-backend:
    permissions:
      contents: read
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.0
    with:
      project-directory: apps/lab/backend
      gradle-task: ../../../gradlew -p ../../.. :apps:lab:backend:build :apps:lab:backend:installDist --configuration-cache
      upload-artifact: true
    secrets: inherit

  build-backend-image:
    needs: build-backend
    permissions:
      contents: read
      id-token: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.1.0
    with:
      docker-context: apps/lab/backend
      dockerfile: apps/lab/backend/.nais/Dockerfile
      image-tag: ${{ github.sha }}
      image-suffix: lab-backend
      use-artifact: true

  deploy-backend:
    needs: build-backend-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.0
    with:
      cluster: dev-gcp
      resource: apps/lab/backend/.nais/naiserator-dev.yaml
      image: ${{ needs.build-backend-image.outputs.image }}
