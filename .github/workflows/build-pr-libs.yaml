name: Build and test PR on libs

on:
  pull_request:
    paths:
      - "libs/oppdrag/**"
      - "libs/tid/**"
      - "libs/http/**"
      - "libs/kotlinx/**"
      - "libs/log/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and test lib beregning
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/beregning
          gradle-task: ../../../gradlew -p ../../.. :libs:beregning:test --configuration-cache

      - name: Build and test lib beregningsflyt
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/beregningsflyt
          gradle-task: ../../../gradlew -p ../../.. :libs:beregningsflyt:test --configuration-cache
          upload-artifact: 'false'

      - name: Build and test lib beregninsflyt-verifikasjon
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/beregningsflyt-verifikasjon
          gradle-task: ../../../gradlew -p ../../.. :libs:beregningsflyt-verifikasjon:test --configuration-cache
          upload-artifact: 'false'
      - name: Build and test lib http
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/http
          gradle-task: ../../../gradlew -p ../../.. :libs:http:test --configuration-cache
          upload-artifact: 'false'

      - name: Build and test lib kotlinx
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/kotlinx
          gradle-task: ../../../gradlew -p ../../.. :libs:kotlinx:test --configuration-cache
          upload-artifact: 'false'

      - name: Build and test lib log
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/log
          gradle-task: ../../../gradlew -p ../../.. :libs:log:test --configuration-cache
          upload-artifact: 'false'
      - name: Build and test lib mq
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/mq
          gradle-task: ../../../gradlew -p ../../.. :libs:mq:test --configuration-cache
          upload-artifact: 'false'
      - name: Build and test lib oppdrag
        uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
        with:
          project-directory: libs/oppdrag
          gradle-task: ../../../gradlew -p ../../.. :libs:oppdrag:test --configuration-cache
          upload-artifact: 'false'