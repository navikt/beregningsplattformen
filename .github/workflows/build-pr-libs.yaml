name: Build and test PR on libs

on:
  pull_request:
    paths:
      - "libs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-pr-libs.yaml"

permissions: {}

jobs:
  test-libs:
    strategy:
      fail-fast: false
      matrix:
        module:
          - libs:beregning
          - libs:beregningsflyt
          - libs:beregningsflyt-verifikasjon
          - libs:http
          - libs:kotlinx
          - libs:log
          - libs:mq
          - libs:oppdrag
          - libs:tid
    permissions:
      contents: read
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
    with:
      gradle-task: ./gradlew :${{ matrix.module }}:test -x ktlintFormat --configuration-cache
