name: Deploy lab frontend to dev-gcp

on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths:
      - "apps/lab/frontend/**"
      - ".github/workflows/deploy-lab-frontend-dev.yaml"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: deploy-lab-frontend-dev
  cancel-in-progress: false

jobs:
  build-frontend-image:
    permissions:
      contents: read
      id-token: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@f76a78f10742990ced901927ed5113f6a0803961 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@v1.1.4
    with:
      project-directory: apps/lab/frontend
      docker-context: apps/lab/frontend
      dockerfile: apps/lab/frontend/.nais/Dockerfile
      server-prune-dev-deps: pnpm run prune:production
      image-tag: ${{ github.sha }}
      image-suffix: lab-frontend
    secrets: inherit # zizmor: ignore[secrets-inherit] trusted SHA-pinned workflow within navikt; requires inherited READER_TOKEN

  deploy-frontend:
    needs: build-frontend-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@f76a78f10742990ced901927ed5113f6a0803961 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.4
    with:
      cluster: dev-gcp
      resource: apps/lab/frontend/.nais/naiserator-dev.yaml
      image: ${{ needs.build-frontend-image.outputs.image }}
