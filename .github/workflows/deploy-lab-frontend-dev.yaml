name: Deploy lab frontend to dev-gcp

on:
  push:
    branches: [main]
    paths:
      - "apps/lab/frontend/**"
      - ".github/workflows/deploy-lab-frontend-dev.yaml"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: deploy-lab-frontend-dev
  cancel-in-progress: false

jobs:
  build-frontend-image:
    permissions:
      contents: read
      id-token: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/node-build-push-image.yaml@v1.1.0
    with:
      project-directory: apps/lab/frontend
      docker-context: apps/lab/frontend
      dockerfile: apps/lab/frontend/.nais/Dockerfile
      server-prune-dev-deps: pnpm run prune:production
      image-tag: ${{ github.sha }}
      image-suffix: lab-frontend
    secrets: inherit

  deploy-frontend:
    needs: build-frontend-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@d9f047707da888caa7b9ba04a7716eb2f3564f27 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.0
    with:
      cluster: dev-gcp
      resource: apps/lab/frontend/.nais/naiserator-dev.yaml
      image: ${{ needs.build-frontend-image.outputs.image }}
