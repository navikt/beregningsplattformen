name: Publiser beregningsflyt-verifikasjon

on:
  push:
    branches: [main]
    paths:
      - "libs/beregningsflyt-verifikasjon/**"
      - ".github/workflows/publiser-beregningsflyt-verifikasjon.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publiser-beregningsflyt-verifikasjon
  cancel-in-progress: false

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and test beregningsflyt-verifikasjon
        run: ./gradlew :libs:beregningsflyt-verifikasjon:build -x ktlintFormat --no-configuration-cache

      - name: Generer versjon
        id: versjon
        run: |
          VERSJON=$(TZ=Europe/Oslo date +%Y%m%d.%H%M)
          echo "## Versjon $VERSJON" >> "$GITHUB_STEP_SUMMARY"
          echo "versjon=$VERSJON" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          MAVEN_PUBLISH_URL: https://maven.pkg.github.com/navikt/beregningsplattformen
          MAVEN_PUBLISH_USER: ${{ github.actor }}
          MAVEN_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSJON: ${{ steps.versjon.outputs.versjon }}
        run: |
          ./gradlew :libs:beregningsflyt-verifikasjon:publish \
            "-PpublicationVersion=$VERSJON" \
            -x ktlintFormat \
            --no-configuration-cache