name: Dependabot frontend auto-merge

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"

permissions: {}

concurrency:
  group: dependabot-frontend-automerge
  cancel-in-progress: false

jobs:
  dependabot-automerge:
    permissions:
      contents: read
      pull-requests: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/dependabot-automerge.yaml@f76a78f10742990ced901927ed5113f6a0803961 # v1.1.4
    with:
      required-labels: javascript
    secrets:
      APP_ID: ${{ vars.APP_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
