name: Deploy mottak

on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches: [main]
    paths:
      - "apps/mottak/**"
      - "libs/oppdrag/**"
      - "libs/tid/**"
      - "libs/http/**"
      - "libs/kotlinx/**"
      - "libs/log/**"
      - "libs/mq/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/deploy-mottak.yaml"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: deploy-mottak
  cancel-in-progress: false

jobs:
  build-mottak:
    permissions:
      contents: read
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@02ef55dcef76850a0c319cdf705904401e77a002 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.3
    with:
      # TODO: Skill arbeidsmappe og artefaktmappe i fellesworkflowen slik at vi kan bygge fra repo-roten.
      project-directory: apps/mottak
      gradle-task: ../../gradlew -p ../.. :apps:mottak:build :apps:mottak:installDist --configuration-cache
      upload-artifact: true
    secrets: inherit

  build-mottak-image:
    needs: build-mottak
    permissions:
      contents: read
      id-token: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@02ef55dcef76850a0c319cdf705904401e77a002 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-push-image.yaml@v1.1.3
    with:
      docker-context: apps/mottak
      dockerfile: apps/mottak/.nais/dev/Dockerfile
      image-tag: ${{ github.sha }}
      image-suffix: mottak
      use-artifact: true

  deploy-mottak-dev:
    needs: build-mottak-image
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@02ef55dcef76850a0c319cdf705904401e77a002 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.3
    with:
      cluster: dev-gcp
      resource: apps/mottak/.nais/dev/naiserator-dev.yaml
      image: ${{ needs.build-mottak-image.outputs.image }}

  # deploy-mottak-prod:
  #   needs: [build-mottak-image, deploy-mottak-dev]
  #   permissions:
  #     contents: read
  #     id-token: write
  #     pull-requests: write
  #     deployments: write
  #   uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@02ef55dcef76850a0c319cdf705904401e77a002 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.3
  #   with:
