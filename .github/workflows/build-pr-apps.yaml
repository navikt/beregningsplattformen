name: Build and test PR on apps

on:
  pull_request:
    paths:
      - "apps/mottak/**"
      - "apps/lab/backend/**"
      - "libs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-pr-apps.yaml"

permissions: {}

jobs:
  test-apps:
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps:mottak
          - apps:lab:backend
    permissions:
      contents: read
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@4b5f646b98c40ca503e95c98af57b2ed4b602805 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.2
    with:
      gradle-task: ./gradlew :${{ matrix.module }}:test -x ktlintFormat --configuration-cache
