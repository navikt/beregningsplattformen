name: Build and test PR on apps

on:
  pull_request:
    paths:
      - "apps/mottak/**"
      - "apps/lab/backend/**"
      - "libs/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-pr-apps.yaml"

permissions: {}

jobs:
  test-apps:
    strategy:
      fail-fast: false
      matrix:
        module:
          - apps:mottak
          - apps:lab:backend
    permissions:
      contents: read
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@02ef55dcef76850a0c319cdf705904401e77a002 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@v1.1.3
    with:
      gradle-task: ./gradlew :${{ matrix.module }}:test -x ktlintFormat --configuration-cache
