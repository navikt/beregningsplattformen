# Finner Gradle-modulene som er endret i pull requesten
# ved hjelp av kommandoen `./gradlew paavirkedeModuler`
# - bruker `alle` som er alle moduler uavhengig av type (app, lib, publisert lib)
# - kjører `:test` på hver av dem i en matrix.
name: Tester alle påvirkede Gradle-moduler endret i pull requesten

on:
  pull_request:

permissions: {}

concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true # Å avbryte kjøringer på pull requesten er trygt, siden vi ikke deployer noe.

jobs:
  finn-moduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      moduler: ${{ steps.finn.outputs.moduler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Trengs for å kunne sammenligne endringer mot base branch
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Finn påvirkede moduler
        id: finn
        shell: bash
        run: |
          MODULER=$(./gradlew -q paavirkedeModuler "--siden=origin/$GITHUB_BASE_REF" | tail -n1 | jq -c .alle)
          echo "Påvirkede moduler: $MODULER"
          echo "moduler=$MODULER" >> "$GITHUB_OUTPUT"

  test:
    needs: finn-moduler
    if: needs.finn-moduler.outputs.moduler != '[]'
    strategy:
      fail-fast: false
      matrix:
        modul: ${{ fromJson(needs.finn-moduler.outputs.moduler) }}
    permissions:
      contents: read
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/gradle-build-test-app.yaml@f76a78f10742990ced901927ed5113f6a0803961 # v1.1.4
    with:
      gradle-task: ./gradlew ${{ matrix.modul }}:test -x ktlintFormat
