name: Publish beregning

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-beregning
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4.2.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and test beregning
        run: ./gradlew :libs:beregning:build -x ktlintFormat --no-configuration-cache

      - name: Generer versjon
        id: versjon
        run: |
          VERSJON=$(TZ=Europe/Oslo date +%Y%m%d.%H%M)
          echo "## Versjon $VERSJON" >> "$GITHUB_STEP_SUMMARY"
          echo "versjon=$VERSJON" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          BIBLIOTEK_PUBLISERING_BRUKER: ${{ github.actor }}
          BIBLIOTEK_PUBLISERING_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :libs:beregning:publish \
            "-PbibliotekVersjon=${{ steps.versjon.outputs.versjon }}" \
            -x ktlintFormat \
            --no-configuration-cache
