name: Publish beregning

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-beregning
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Build and test beregning
        run: ./gradlew :libs:beregning:build -x ktlintFormat --no-configuration-cache

      - name: Generer versjon
        id: versjon
        run: |
          VERSJON=$(TZ=Europe/Oslo date +%Y%m%d.%H%M)
          echo "## Versjon $VERSJON" >> "$GITHUB_STEP_SUMMARY"
          echo "versjon=$VERSJON" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          BIBLIOTEK_PUBLISERING_BRUKER: ${{ github.actor }}
          BIBLIOTEK_PUBLISERING_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :libs:beregning:publish \
            "-PbibliotekVersjon=${{ steps.versjon.outputs.versjon }}" \
            -x ktlintFormat \
            --no-configuration-cache
