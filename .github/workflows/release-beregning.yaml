name: Publish beregning

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-beregning
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Verify release tag and calculate version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit"
          git merge-base --is-ancestor "$head_commit" origin/main

          commit_timestamp="$(git show -s --format=%cI "$head_commit")"
          commit_date="$(date -u -d "$commit_timestamp" +%Y.%m.%d)"
          short_hash="$(git rev-parse "$head_commit" | cut -c1-7)"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "version=$commit_date-$short_hash" >> "$GITHUB_OUTPUT"

      - name: Build and test beregning
        run: ./gradlew :libs:beregning:build -x ktlintFormat --no-configuration-cache

      - name: Ensure build did not change tracked files
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Generer versjon
        id: versjon
        run: |
          VERSJON=$(TZ=Europe/Oslo date +%Y%m%d.%H%M)
          echo "## Versjon $VERSJON" >> "$GITHUB_STEP_SUMMARY"
          echo "versjon=$VERSJON" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.2.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Publish to GitHub Packages
        env:
          MAVEN_PUBLISH_URL: https://maven.pkg.github.com/navikt/beregningsplattformen
          MAVEN_PUBLISH_USER: ${{ github.actor }}
          MAVEN_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSJON: ${{ steps.versjon.outputs.versjon }}
        run: |
          ./gradlew :libs:beregning:publish \
            "-PpublicationVersion=$VERSJON" \
            -x ktlintFormat \
            --no-configuration-cache

      - name: Ensure publish did not change tracked files
        run: test -z "$(git status --porcelain --untracked-files=all)"
